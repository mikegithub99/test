apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-client-config
  namespace: grpc-demo
data:
  GRPC_KUBERNETES_IN_CLUSTER: "true"
  GRPC_KUBERNETES_NAMESPACE: "grpc-demo"
  GRPC_CUSTOMER_TARGET: "kube:///customer-service"
  GRPC_RETRY_MAX_ATTEMPTS: "10"
  GRPC_RETRY_DELAY_MILLIS: "1000"
  GRPC_RETRY_BACKOFF_MULTIPLIER: "2.0"
  GRPC_RETRY_MAX_DELAY_MILLIS: "30000"
  GRPC_RETRY_RETRYABLE_STATUSES: "UNAVAILABLE,DEADLINE_EXCEEDED,RESOURCE_EXHAUSTED"
